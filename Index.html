<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بانر متجر ليو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--g:#e4af3c;--g2:#f6d57e;--g3:#9a6d18;--bg:#0a0907;--bg2:#17120a;--ink:#f6edd8;box-sizing:border-box}
*{box-sizing:inherit;margin:0}
html,body{height:100%;background:var(--bg)}
body{display:grid;place-items:center;font-family:Cairo,Tahoma,sans-serif;color:var(--ink);overflow:hidden}
.banner{position:relative;width:min(100vw,calc(100vh*3.2));aspect-ratio:16/5;container-type:inline-size;overflow:hidden;isolation:isolate;
 display:flex;align-items:center;gap:3.5cqw;padding:0 5cqw;
 background:radial-gradient(34cqw 26cqw at 90% 50%,rgba(228,175,60,.16),transparent 70%),radial-gradient(30cqw 22cqw at 8% 50%,rgba(228,175,60,.12),transparent 70%),linear-gradient(100deg,var(--bg2),var(--bg))}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
 background:radial-gradient(rgba(228,175,60,.16) .09cqw,transparent .12cqw) 0 0/.9cqw .9cqw}
.frame{position:absolute;inset:1.1cqw;border:.12cqw solid rgba(228,175,60,.45);border-radius:1.8cqw;pointer-events:none}
.logo{position:relative;flex:none;width:19cqw;height:19cqw;border-radius:50%;display:grid;place-items:center;cursor:pointer;
 background:radial-gradient(circle at 50% 35%,#4a4130,#1b160d 75%);box-shadow:0 0 0 .5cqw var(--g),0 0 0 1cqw rgba(0,0,0,.7),0 0 0 1.15cqw rgba(246,213,126,.7),0 0 5cqw rgba(228,175,60,.35)}
.logo img{width:88%;height:88%;object-fit:contain;border-radius:50%}
.stage{position:relative;flex:1;height:100%;z-index:2}
.msg{position:absolute;inset:0 0 7cqw;display:flex;flex-direction:column;justify-content:center;gap:1.2cqw;opacity:0;transform:translateY(12%);transition:opacity 1s ease,transform 1.2s ease}
.msg.on{opacity:1;transform:none}.msg.out{opacity:0;transform:translateY(-12%)}
.big{font-weight:900;font-size:4.7cqw;line-height:1.3}
.gold{background:linear-gradient(180deg,var(--g2),var(--g) 60%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.mid{font-size:6.4cqw;line-height:1.25}
.sub{font-weight:600;font-size:2.3cqw;color:rgba(246,237,216,.78)}
.pill{align-self:flex-start;background:linear-gradient(180deg,var(--g2),var(--g));color:#2a1c04;font-weight:900;font-size:2.5cqw;padding:.2cqw 2cqw;border-radius:9cqw}
.link{position:absolute;inset-inline-start:0;bottom:3.2cqw;display:flex;align-items:center;gap:1cqw;font-weight:600;font-size:2.2cqw;color:var(--g2);
 padding:.35cqw 1.8cqw;border:.12cqw solid rgba(228,175,60,.6);border-radius:9cqw;background:rgba(228,175,60,.08);z-index:3}
.link b{font-weight:900;color:var(--ink)}
.link::before{content:"";width:.9cqw;height:.9cqw;border-radius:50%;background:var(--g);animation:dot 2.4s ease-in-out infinite}
.coin{flex:none;width:17cqw;position:relative;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 1.5cqw 3cqw rgba(0,0,0,.6)) drop-shadow(0 0 3cqw rgba(228,175,60,.3))}
.coin img{display:block;width:100%;animation:sway 8s ease-in-out infinite}
.coin::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.35) 50%,transparent 58%) -160% 0/260% 100%;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;animation:shine 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-1.2cqw)}}
@keyframes sway{50%{transform:rotate(-3deg)}}
@keyframes shine{0%,60%{background-position:-160% 0}100%{background-position:160% 0}}
@keyframes dot{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.msg{transition:opacity .4s;transform:none!important}}
</style>
</head>

function next(){const p=msgs[i];
  if(p){p.classList.remove('on');p.classList.add('out');setTimeout(()=>p.classList.remove('out'),1000)}
